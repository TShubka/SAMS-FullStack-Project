spring:
  application:
    name: sams
  profiles:
    active: dev
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:sams_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

server:
  port: ${SERVER_PORT:8080}
  error:
    include-stacktrace: never

# Application business settings. Single source of truth for tunable rules.
app:
  attendance:
    threshold: 75.0        # low-attendance alert cut-off (percent)
    late-counts-as-present: true
  grading:
    pass-percentage: 50.0
  jwt:
    secret: ${JWT_SECRET:changeit-in-env-this-is-a-dev-only-placeholder-secret-key-min-32-bytes}
    expiration-ms: 86400000  # 24 hours
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173}
